name: Build XboxGlassMusic APPX

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Locate UWP project
        id: locate
        shell: pwsh
        run: |
          $project = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter "XboxGlassMusic.csproj" |
            Select-Object -First 1

          if (-not $project) {
            throw "XboxGlassMusic.csproj was not found."
          }

          $solution = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter "XboxGlassMusic.sln" |
            Select-Object -First 1

          if (-not $solution) {
            throw "XboxGlassMusic.sln was not found."
          }

          "projectPath=$($project.FullName)" >> $env:GITHUB_OUTPUT
          "projectDir=$($project.DirectoryName)" >> $env:GITHUB_OUTPUT
          "solutionPath=$($solution.FullName)" >> $env:GITHUB_OUTPUT

          Write-Host "Project: $($project.FullName)"
          Write-Host "Solution: $($solution.FullName)"

      - name: Clean previous build files
        shell: pwsh
        run: |
          $projectDir = "${{ steps.locate.outputs.projectDir }}"

          foreach ($folder in @("bin", "obj")) {
            $path = Join-Path $projectDir $folder

            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
              Write-Host "Removed $path"
            }
          }

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $project = "${{ steps.locate.outputs.projectPath }}"

          & msbuild $project /t:Restore /v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed with exit code $LASTEXITCODE"
          }

      - name: Remove legacy NuGet lock files
        shell: pwsh
        run: |
          $projectDir = "${{ steps.locate.outputs.projectDir }}"

          Get-ChildItem $projectDir -Recurse -File -Filter "project.lock.json" |
            ForEach-Object {
              Write-Host "Removing legacy lock file: $($_.FullName)"
              Remove-Item $_.FullName -Force
            }

      - name: Diagnose UWP NuGet restore
        if: always()
        shell: pwsh
        run: |
          $projectDir = "${{ steps.locate.outputs.projectDir }}"

          Write-Host "=== NuGet asset and lock files ==="

          Get-ChildItem $projectDir -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @(
                "project.lock.json",
                "project.assets.json",
                "packages.lock.json"
              )
            } |
            ForEach-Object {
              Write-Host "`n=== $($_.FullName) ==="

              if ($_.Name -eq "project.assets.json") {
                try {
                  $data = Get-Content $_.FullName -Raw | ConvertFrom-Json

                  Write-Host "Targets:"
                  $data.targets.PSObject.Properties.Name

                  Write-Host "Frameworks:"
                  $data.project.frameworks.PSObject.Properties.Name

                  Write-Host "Relevant packages:"
                  $data.targets.PSObject.Properties | ForEach-Object {
                    $targetName = $_.Name

                    $_.Value.PSObject.Properties |
                      Where-Object {
                        $_.Name -match "Microsoft.NETCore|NETFramework|FrameworkReference"
                      } |
                      ForEach-Object {
                        Write-Host "$targetName : $($_.Name)"
                      }
                  }
                }
                catch {
                  Write-Host "Could not parse assets file: $_"
                }
              }
              else {
                Write-Host "File exists: $($_.FullName)"
              }
            }

      - name: Diagnose framework injection
        if: always()
        shell: pwsh
        run: |
          $project = "${{ steps.locate.outputs.projectPath }}"
          $projectDir = "${{ steps.locate.outputs.projectDir }}"

          Write-Host "=== Relevant MSBuild properties ==="

          & msbuild $project `
            "-getProperty:ProjectLockFile,MSBuildProjectExtensionsPath,ResolveNuGetPackages,AppxPackage,_NetCoreFrameworkInjectionNeeded" `
            /p:Configuration=Release `
            /p:Platform=x64

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Property query failed; continuing with file inspection."
          }

          Write-Host "`n=== Files in project obj directory ==="

          $obj = Join-Path $projectDir "obj"

          if (Test-Path $obj) {
            Get-ChildItem $obj -Recurse -File |
              Where-Object {
                $_.Name -in @(
                  "project.lock.json",
                  "project.assets.json",
                  "packages.lock.json"
                )
              } |
              ForEach-Object {
                Write-Host $_.FullName
              }
          }
          else {
            Write-Host "No obj directory found."
          }

          Write-Host "`n=== Inspect restored dependency graph ==="

          $assets = Join-Path $projectDir "obj\project.assets.json"

          if (Test-Path $assets) {
            try {
              $data = Get-Content $assets -Raw | ConvertFrom-Json

              Write-Host "`n=== Restored target frameworks ==="
              $data.targets.PSObject.Properties.Name

              Write-Host "`n=== Declared frameworks ==="
              $data.project.frameworks.PSObject.Properties.Name

              Write-Host "`n=== .NET Framework-related package entries ==="

              $data.targets.PSObject.Properties | ForEach-Object {
                $targetName = $_.Name

                $_.Value.PSObject.Properties |
                  Where-Object {
                    $_.Name -match "framework|netfx|referenceassemblies"
                  } |
                  ForEach-Object {
                    Write-Host "$targetName : $($_.Name)"
                  }
              }

              Write-Host "`n=== Direct project dependencies ==="

              $data.project.frameworks.PSObject.Properties | ForEach-Object {
                $frameworkName = $_.Name
                Write-Host "Framework: $frameworkName"

                $_.Value.dependencies.PSObject.Properties |
                  ForEach-Object {
                    Write-Host "  $($_.Name) $($_.Value.version)"
                  }
              }
            }
            catch {
              Write-Host "Failed to inspect assets file: $_"
            }
          }
          else {
            Write-Host "project.assets.json was not found."
          }

      - name: Build and create APPX package
        shell: pwsh
        run: |
          $solution = "${{ steps.locate.outputs.solutionPath }}"
          $out = "$env:GITHUB_WORKSPACE\artifacts"
          $log = "$env:RUNNER_TEMP\appx-build.log"
          $packageDir = "$out\"

          New-Item -ItemType Directory -Force -Path $out | Out-Null

          & msbuild $solution `
            /t:Build `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            "/p:AppxPackageDir=$packageDir" `
            /v:diag *> $log

          $buildExitCode = $LASTEXITCODE

          Write-Host "=== Last 100 build log lines ==="
          Get-Content $log -Tail 100

          if ($buildExitCode -ne 0) {
            Write-Host "`n=== Relevant build errors ==="

            Select-String -Path $log `
              -Pattern "error |NetCoreFramework|requires the .NET Framework|WMC9999" `
              -Context 3, 6

            throw "APPX build failed with exit code $buildExitCode"
          }

          Write-Host "`n=== Generated APPX/MSIX files ==="

          $packages = Get-ChildItem $out -Recurse -File |
            Where-Object {
              $_.Extension -in @(".appx", ".msix")
            }

          if (-not $packages) {
            Write-Host "No package found in artifacts directory. Searching project output..."

            $projectDir = "${{ steps.locate.outputs.projectDir }}"

            $packages = Get-ChildItem $projectDir -Recurse -File |
              Where-Object {
                $_.Extension -in @(".appx", ".msix")
              }
          }

          if (-not $packages) {
            throw "Build succeeded, but no .appx or .msix package was found."
          }

          foreach ($package in $packages) {
            Write-Host "Package: $($package.FullName)"
            Write-Host "Size: $($package.Length) bytes"
          }

      - name: Upload APPX artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XboxGlassMusic-APPX
          path: |
            artifacts/**/*.appx
            artifacts/**/*.msix
            ${{ steps.locate.outputs.projectDir }}/**/*.appx
            ${{ steps.locate.outputs.projectDir }}/**/*.msix
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XboxGlassMusic-build-log
          path: ${{ runner.temp }}/appx-build.log
          if-no-files-found: ignore
          retention-days: 7
