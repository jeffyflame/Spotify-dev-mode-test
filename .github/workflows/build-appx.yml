
name: Build XboxGlassMusic APPX

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - '**.sln'
      - '**.appxmanifest'
      - '**.props'
      - '**.targets'
      - 'packages.config'
      - '.github/workflows/build-appx.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Locate project
        id: locate
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE

          $project = Get-ChildItem `
            -Path $root `
            -Recurse `
            -File `
            -Filter XboxGlassMusic.csproj |
            Select-Object -First 1

          if (-not $project) {
            throw "XboxGlassMusic.csproj was not found."
          }

          $solution = Get-ChildItem `
            -Path $root `
            -Recurse `
            -File `
            -Filter *.sln |
            Select-Object -First 1

          if (-not $solution) {
            throw "No solution file was found."
          }

          "projectPath=$($project.FullName)" |
            Out-File $env:GITHUB_OUTPUT -Append

          "projectDir=$($project.DirectoryName)" |
            Out-File $env:GITHUB_OUTPUT -Append

          "solutionPath=$($solution.FullName)" |
            Out-File $env:GITHUB_OUTPUT -Append

          Write-Host "Project: $($project.FullName)"
          Write-Host "Solution: $($solution.FullName)"

      - name: Clean previous build files
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE

          foreach ($folderName in @("bin", "obj")) {
            Get-ChildItem `
              -Path $root `
              -Recurse `
              -Directory `
              -Force `
              -Filter $folderName `
              -ErrorAction SilentlyContinue |
              Sort-Object {
                $_.FullName.Length
              } -Descending |
              ForEach-Object {
                Write-Host "Removing $($_.FullName)"
                Remove-Item `
                  -LiteralPath $_.FullName `
                  -Recurse `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$root\artifacts" |
            Out-Null

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $project = "${{ steps.locate.outputs.projectPath }}"

          msbuild $project `
            /t:Restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed with exit code $LASTEXITCODE"
          }

      - name: Remove legacy NuGet lock files
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE

          # Keep obj/project.assets.json.
          # Remove only legacy project.lock.json files.
          $locks = Get-ChildItem `
            -Path $root `
            -Recurse `
            -File `
            -Filter project.lock.json `
            -ErrorAction SilentlyContinue

          foreach ($file in $locks) {
            Write-Host "Removing legacy lock file: $($file.FullName)"

            Remove-Item `
              -LiteralPath $file.FullName `
              -Force
          }

          Write-Host "Legacy lock-file cleanup complete."

      - name: Build and create APPX package
        shell: pwsh
        run: |
          $solution = "${{ steps.locate.outputs.solutionPath }}"
          $out = "$env:GITHUB_WORKSPACE\artifacts"
          $log = "$env:RUNNER_TEMP\appx-build.log"

          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Write-Host "Building UWP solution and generating APPX..."
          Write-Host "Solution: $solution"
          Write-Host "Output: $out"

          & msbuild $solution `
            /t:Build `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            "/p:AppxPackageDir=$out\\" `
            /v:diag *> $log

          $buildExitCode = $LASTEXITCODE

          Get-Content $log -Tail 80

          if ($buildExitCode -ne 0) {
            Write-Host "Build errors:"
            Select-String `
              -Path $log `
              -Pattern "error |NetCoreFramework|requires the .NET Framework" `
              -Context 3, 6

            throw "Build/package failed with exit code $buildExitCode"
          }

          $packages = Get-ChildItem `
            -Path $out `
            -Recurse `
            -File |
            Where-Object { $_.Extension -in @(".appx", ".msix") }

          if (-not $packages) {
            Get-ChildItem $out -Recurse
            throw "Build completed, but no APPX/MSIX package was generated."
          }

          Write-Host "Generated packages:"
          $packages | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Upload APPX package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XboxGlassMusic-x64-appx
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XboxGlassMusic-build-log
          path: ${{ runner.temp }}/appx-build.log
          if-no-files-found: ignore
          retention-days: 7
