name: Build XboxGlassMusic package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - '**.sln'
      - '**.appxmanifest'
      - '.github/workflows/build-appx.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Locate solution
        id: project
        shell: pwsh
        run: |
          $solution = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter *.sln |
            Select-Object -First 1

          if (-not $solution) {
            throw "No solution file found."
          }

          "solution=$($solution.FullName)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Clean old build files
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE

          foreach ($folderName in @("bin", "obj")) {
            Get-ChildItem `
              -Path $workspace `
              -Directory `
              -Recurse `
              -Force `
              -Filter $folderName `
              -ErrorAction SilentlyContinue |
              Sort-Object { $_.FullName.Length } -Descending |
              ForEach-Object {
                Remove-Item `
                  -LiteralPath $_.FullName `
                  -Recurse `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
          }

      - name: Create temporary signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=XboxGlassMusic" `
            -KeyUsage DigitalSignature `
            -FriendlyName "XboxGlassMusic temporary package certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(2)

          $password = ConvertTo-SecureString `
            -String "TemporaryBuildPassword123!" `
            -Force `
            -AsPlainText

          Export-PfxCertificate `
            -Cert $cert `
            -FilePath "$env:RUNNER_TEMP\signing.pfx" `
            -Password $password |
            Out-Null

          Export-Certificate `
            -Cert $cert `
            -FilePath "$env:RUNNER_TEMP\signing.cer" |
            Out-Null

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          msbuild "${{ steps.project.outputs.solution }}" `
            /t:Restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed with exit code $LASTEXITCODE"
          }

      - name: Build and package x64
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\artifacts"
          $log = "$env:RUNNER_TEMP\msbuild.log"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $out |
            Out-Null

          msbuild "${{ steps.project.outputs.solution }}" `
            /t:Build `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:ResolveNuGetPackages=false `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\signing.pfx" `
            /p:PackageCertificatePassword="TemporaryBuildPassword123!" `
            /p:AppxPackageDir="$out\\" `
            /v:diag *> $log

          $buildExitCode = $LASTEXITCODE

          Get-Content $log -Tail 100

          if ($buildExitCode -ne 0) {
            Write-Host "Relevant framework and NuGet errors:"

            Select-String `
              -Path $log `
              -Pattern "NetCoreFramework|requires the .NET Framework|error NU" `
              -Context 5, 10

            throw "MSBuild failed with exit code $buildExitCode"
          }

          Copy-Item `
            "$env:RUNNER_TEMP\signing.cer" `
            "$out\XboxGlassMusic-signing.cer"

          Write-Host "Build output:"
          Get-ChildItem $out -Recurse

      - name: Upload app package
        uses: actions/upload-artifact@v4
        with:
          name: XboxGlassMusic-x64-appx
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30
